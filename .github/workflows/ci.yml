name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features memory"
          - "--no-default-features --features redis"
          - "--no-default-features --features postgres"
          - "--no-default-features --features mysql"
          - "--all-features"
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build ${{ matrix.features }}

  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-features

  test-memory:
    name: Test (memory)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --no-default-features --features memory

  test-redis:
    name: Test (redis)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      REDIS_URL: redis://127.0.0.1
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --no-default-features --features redis

  test-postgres:
    name: Test (postgres)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      POSTGRES_URL: postgresql://postgres:password@127.0.0.1:5432
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --no-default-features --features postgres

  test-mysql:
    name: Test (mysql)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      MYSQL_URL: mysql://root:password@127.0.0.1:3306
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --no-default-features --features mysql
